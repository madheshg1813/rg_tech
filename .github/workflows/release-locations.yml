name: Release locality pages

# Releases one locality per secondary city. Releasing a locality publishes all
# six of its service pages at once, so a run is 18 pages across three cities.
#
# The commit to content/published-locations.json is what triggers the rebuild,
# so no separate deploy hook is needed here.
#
# ---------------------------------------------------------------------------
# PAUSED 5 Sep 2026, on request: locality output stops, blog publishing
# continues. The daily `schedule` trigger below is commented out rather than
# deleted so this can be turned back on by uncommenting two lines.
#
# Pausing does NOT unpublish anything. Every locality already listed in
# content/published-locations.json stays live and stays in the sitemap; this
# only stops NEW ones being added. 85 localities were live at the time of
# pausing, with 65 still queued in content/locations.mjs.
#
# The workflow can still be run by hand from the Actions tab (Run workflow),
# which is why workflow_dispatch is left in place.
# ---------------------------------------------------------------------------
on:
  # schedule:
  #   - cron: '0 4 * * *' # 09:30 IST daily
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Show what would release without committing'
        type: boolean
        default: false

concurrency:
  group: release-locations
  cancel-in-progress: false

permissions:
  contents: write # needed to commit the updated state file

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Release next localities
        id: release
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/release-locations.mjs --dry-run
          else
            node scripts/release-locations.mjs
          fi

      - name: Commit released state
        if: ${{ inputs.dry_run != true }}
        run: |
          if git diff --quiet content/published-locations.json; then
            echo "Nothing released today — no commit."
            exit 0
          fi

          SUMMARY=$(node -e "
            const r = require('./release-summary.json');
            console.log(r.map(x => x.cityName + ': ' + x.locality).join(' · '));
          ")

          git config user.name  'rg-tech-bot'
          git config user.email 'actions@github.com'
          git add content/published-locations.json
          git commit -m "chore: release locality pages — $SUMMARY

          Each locality publishes all 6 service pages. Generated by
          .github/workflows/release-locations.yml"
          git push

      # Best effort: marks the rows in the tracking sheet as published.
      # Skipped silently when the webhook secret is not configured, so a missing
      # Apps Script deployment never fails the release itself.
      - name: Update tracking sheet
        if: ${{ inputs.dry_run != true }}
        env:
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
        run: |
          if [ -z "$SHEET_WEBHOOK_URL" ]; then
            echo "SHEET_WEBHOOK_URL not set — skipping sheet update."
            exit 0
          fi
          if [ ! -f release-summary.json ]; then
            echo "Nothing released — skipping sheet update."
            exit 0
          fi
          curl -fsS -X POST "$SHEET_WEBHOOK_URL" \
            -H 'Content-Type: text/plain;charset=utf-8' \
            -d "$(node -e "
              const r = require('./release-summary.json');
              const rows = r.flatMap(x => x.urls.map(u => ({
                slug: new URL(u).pathname, url: u, status: 'Published'
              })));
              console.log(JSON.stringify({ action: 'markPublished', rows }));
            ")" || echo "Sheet update failed — release still succeeded."
